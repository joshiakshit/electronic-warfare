[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ewscan"
version = "0.1.0"
description = "ML-based Electronic Support receiver scan scheduler"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "SIH 2026 Team" }
]
dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["ewscan"]

[tool.setuptools.package-data]
ewscan = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running performance gates, deselect with -m 'not slow'",
]
