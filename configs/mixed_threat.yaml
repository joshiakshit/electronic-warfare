# Canned Demo Scenario 2: Mixed Threat Spectrum
# 16 bands, loud CW background, periodic radar, Markov emitter, and a rare high-threat emitter.
n_bands: 16
n_slots: 2000
k: 1
detection_threshold: 3.0
pfa: 0.0001
seed: 42
emitters:
  - band: 1
    snr: 25.0
    threat_level: 0.2
    emitter_type: cw
    params: {}
  - band: 4
    snr: 20.0
    threat_level: 0.8
    emitter_type: periodic
    params:
      period: 40
      dwell: 8
      jitter: 1
      phase: 0
  - band: 9
    snr: 18.0
    threat_level: 0.9
    emitter_type: gilbert_elliott
    params:
      p01: 0.10
      p10: 0.10
  - band: 14
    snr: 22.0
    threat_level: 1.0
    emitter_type: gilbert_elliott
    params:
      p01: 0.03
      p10: 0.20
