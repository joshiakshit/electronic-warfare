# Canned Demo Scenario 3: Periodic Radar Spectrum
# 16 bands, 3 periodic radars of differing periods, dwells, and phase offsets.
n_bands: 16
n_slots: 2000
k: 1
detection_threshold: 3.0
pfa: 0.0001
seed: 42
emitters:
  - band: 2
    snr: 20.0
    threat_level: 0.9
    emitter_type: periodic
    params:
      period: 20
      dwell: 3
      jitter: 1
      phase: 5
  - band: 8
    snr: 18.0
    threat_level: 1.0
    emitter_type: periodic
    params:
      period: 50
      dwell: 5
      jitter: 2
      phase: 12
  - band: 13
    snr: 15.0
    threat_level: 0.7
    emitter_type: periodic
    params:
      period: 35
      dwell: 4
      jitter: 1
      phase: 0
